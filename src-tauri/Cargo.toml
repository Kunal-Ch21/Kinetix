[package]
name = "kinetix-studio"
version = "0.4.0"
description = "Kinetix Studio — native 2D AI motion, vector & character animation suite (100% offline)"
authors = ["Kinetix Studio"]
homepage = "https://github.com/Kunal-Ch21/Kinetix"
repository = "https://github.com/Kunal-Ch21/Kinetix"
readme = "../README.md"
keywords = ["animation", "tauri", "vector", "offline", "ffmpeg"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kinetix_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite is compiled in (bundled) — no system dependency, WAL mode enabled at open().
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"

# Milestone 2 — local AI pipeline (talks to 127.0.0.1 only: Ollama :11434 / llama.cpp :8080)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
tokio-util = "0.7"
strsim = "0.11"
futures-util = "0.3"

[dev-dependencies]
# Milestone 4 tests encode tiny PNG frames to drive the real ffmpeg pipeline
png = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

# Fast iteration for `cargo test` / `tauri dev` without paying for LTO.
[profile.dev.package."*"]
opt-level = 1
